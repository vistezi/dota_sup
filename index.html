<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota Sup - Meta</title>
    <style>
        :root {
            --bg-dark: #12171c;
            --bg-card: #1c242d;
            --header-bg: #242f39;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --accent-orange: #f57c00;
            --winrate-green: #4ade80;
            --pickrate-yellow: #fbbf24;
            --tier-s: #a855f7;
            --hero-name-color: #84cc16;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 20px;
        }

        header {
            background: var(--header-bg);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2d3741;
        }

        .logo {
            background: var(--accent-orange);
            color: white;
            padding: 4px 12px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 16px;
            letter-spacing: 1px;
            border-radius: 2px;
        }

        nav {
            background: var(--bg-card);
            display: flex;
            overflow-x: auto;
            padding: 12px 15px;
            gap: 20px;
            border-bottom: 1px solid #2d3741;
        }

        nav span { color: var(--hero-name-color); font-size: 13px; font-weight: 500; text-transform: uppercase; white-space: nowrap; }
        nav span.active { border-bottom: 2px solid var(--hero-name-color); padding-bottom: 2px; }

        .table-header {
            display: grid;
            grid-template-columns: 2.5fr 0.8fr 1.5fr 1.5fr;
            padding: 15px;
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
        }

        .hero-list { padding: 0 8px; }

        .hero-row {
            display: grid;
            grid-template-columns: 2.5fr 0.8fr 1.5fr 1.5fr;
            align-items: center;
            background: var(--bg-card);
            margin-bottom: 2px;
            padding: 10px;
            border-radius: 2px;
        }

        .hero-info { display: flex; align-items: center; gap: 10px; }
        .hero-img {
            width: 45px;
            height: 25px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #444;
        }
        .hero-img img { width: 100%; height: 100%; object-fit: cover; }

        .hero-name { font-size: 14px; font-weight: 600; color: var(--hero-name-color); }

        .tier {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            color: white;
            background: var(--tier-s);
        }

        .stat-group { display: flex; flex-direction: column; gap: 4px; }
        .val { font-size: 13px; font-weight: 500; font-family: 'Courier New', monospace; }
        .bar { height: 3px; border-radius: 2px; background: #2d3741; width: 85%; overflow: hidden; }
        .fill { height: 100%; border-radius: 2px; }
        .fill-win { background: var(--winrate-green); }
        .fill-pick { background: var(--pickrate-yellow); }
    </style>
</head>
<body>

<header>
    <div class="logo">DOTA SUP</div>
    <div style="font-size: 14px; color: var(--text-dim);">🔍 &nbsp; <span style="color:white">Войти</span></div>
</header>

<nav>
    <span class="active">Мета</span>
    <span>Популярные</span>
    <span>Победные</span>
    <span>Боевые</span>
</nav>

<div class="table-header">
    <span>Герой</span>
    <span>Уровень</span>
    <span>Процент побед</span>
    <span>Частота выбора</span>
</div>

<div class="hero-list">
    <div class="hero-row">
        <div class="hero-info">
            <div class="hero-img">
                <img src="spectre.png" alt="Spectre">
            </div>
            <span class="hero-name">Spectre</span>
        </div>
        <div class="tier">S</div>
        <div class="stat-group">
            <span class="val">54,78%</span>
            <div class="bar"><div class="fill fill-win" style="width: 82%;"></div></div>
        </div>
        <div class="stat-group">
            <span class="val">9,67%</span>
            <div class="bar"><div class="fill fill-pick" style="width: 30%;"></div></div>
        </div>
    </div>

    <div class="hero-row">
        <div class="hero-info">
            <div class="hero-img">
                <img src="axe.png" alt="Axe">
            </div>
            <span class="hero-name">Axe</span>
        </div>
        <div class="tier">S</div>
        <div class="stat-group">
            <span class="val">53,46%</span>
            <div class="bar"><div class="fill fill-win" style="width: 78%;"></div></div>
        </div>
        <div class="stat-group">
            <span class="val">17,37%</span>
            <div class="bar"><div class="fill fill-pick" style="width: 60%;"></div></div>
        </div>
    </div>
</div>

<div style="text-align: center; margin-top: 30px; padding: 20px;">
    <p style="color: var(--text-dim); font-size: 12px;">Создано для DOTA SUP</p>
</div>

</body>
</html>
